[package]
name = "malfang_tool"
version = "1.0.3"
edition = "2021"

[[bin]]
name = "malfang_tool"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
roxmltree = "0.21"
